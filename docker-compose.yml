services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: filetools
      POSTGRES_USER: filetools_user
      POSTGRES_PASSWORD:  ${database_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  web:
    build: .
    container_name: django_pdf_to_word
    command: gunicorn Filetools.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    working_dir: /app
    volumes:
      - .:/app
      - media_value:/app/media
    environment:
      - DATABASE_URL=postgres://filetools_user:${database_password}@db:5432/filetools
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  celery:
    build: .
    container_name: celery_worker
    working_dir: /app
    command: celery -A Filetools worker --loglevel=info
    volumes:
      - .:/app
      - media_value:/app/media
    environment:
      - DATABASE_URL=postgres://filetools_user:${database_password}@db:5432/filetools
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  celery-beat:
    build: .
    container_name: celery_beat
    working_dir: /app
    command: celery -A Filetools beat --loglevel=info
    volumes:
      - .:/app
      - media_value:/app/media
    environment:
      - DATABASE_URL=postgres://filetools_user:${database_password}@db:5432/filetools
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_value:/app/static
      - media_value:/app/media
    depends_on:
      - web
    restart: always

volumes:
    postgres_data:
    static_value:
    media_value:
